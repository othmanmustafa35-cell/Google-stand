<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو حماد للإنارة الكهربائية</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            text-align: center;
            color: white; 
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #000; /* لون أسود للأساس ليتناسب مع إضاءة الثريات */
        }

        /* -------------------------------------- */
        /* خلفية الإضاءة (بدون غباش) */
        /* -------------------------------------- */
        .bg-image {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            /* صورة مشابهة جداً للثريات الدائرية في صورتك مع طبقة تعتيم خفيفة لإبراز الأزرار */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1540932239986-30128078f3c5?q=80&w=1080&auto=format&fit=crop') no-repeat center center/cover;
            z-index: -2; 
        }

        /* -------------------------------------- */
        /* المحتوى الأساسي والأزرار */
        /* -------------------------------------- */
        .content { 
            max-width: 400px; 
            margin: 0 auto; 
            padding: 50px 20px; 
            position: relative;
            z-index: 1; 
        }

        /* شعار المعرض */
        img.logo { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 10px; 
            border: 3px solid #f9d71c; /* إطار بلون الضوء الأصفر المودرن */
            background-color: rgba(0,0,0,0.6);
            padding: 12px;
            box-shadow: 0 0 25px rgba(249, 215, 28, 0.5); /* إشعاع خفيف حول الشعار */
        }
        
        h1 { 
            font-size: 28px; 
            margin-bottom: 5px; 
            font-weight: bold; 
            text-shadow: 2px 2px 8px rgba(0,0,0,1); 
            letter-spacing: 1px; 
            color: #fff; 
        }
        p { 
            color: #e0e0e0; 
            margin-bottom: 35px; 
            font-size: 16px; 
            text-shadow: 1px 1px 6px rgba(0,0,0,1); 
        }
        
        /* أزرار زجاجية فخمة تناسب الإضاءة */
        a.btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 16px; 
            border-radius: 12px; 
            text-decoration: none; 
            color: #ffffff;
            font-size: 17px; 
            font-weight: bold; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
            
            /* تصميم الأزرار الزجاجي الداكن */
            background: rgba(15, 15, 15, 0.65); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(249, 215, 28, 0.4); /* إطار بلون الإنارة الدافئة */
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }
        
        a.btn:active { 
            transform: scale(0.96); 
            box-shadow: 0 0 15px rgba(249, 215, 28, 0.4); 
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- صورة الخلفية الفخمة -->
    <div class="bg-image"></div>

    <!-- قسم المحتوى -->
    <div class="content">
        <!-- الشعار (أيقونة إنارة) -->
        <img src="https://cdn-icons-png.flaticon.com/512/3133/3133310.png" alt="شعار أبو حماد للإنارة" class="logo">
        
        <h1>أبو حماد للإنارة</h1>
        <p>أنر منزلك بأرقى التصاميم.. نتشرف بتقييمك!</p>

        <a href="https://www.instagram.com/othman_alaqqad?igsh=MXh3cHdjMzZnbWE2Nw%3D%3D&utm_source=qr" class="btn">📸 تابعنا على انستقرام</a>
        
        <a href="https://snapchat.com/t/cGr2yvt7" class="btn">👻 تابعنا على سناب شات</a>
        
        <a href="https://wa.me/qr/O4RDOZZIGYNIE1" class="btn">💬 تواصل معنا واتساب</a>
    </div>

</body>
