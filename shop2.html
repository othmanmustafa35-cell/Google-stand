<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم برجر ستيشن</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            text-align: center;
            color: white; /* لون النص أبيض ليناسب الخلفية الداكنة */
            min-height: 100vh;
        }

        /* -------------------------------------- */
        /* برمجة الخلفية والعناصر المتحركة (برجر، بطاطا، بيبسي) */
        /* -------------------------------------- */
        .bg-animation {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            z-index: -1; /* إبقاء الخلفية خلف الأزرار */
            overflow: hidden;
            background-color: #121212; /* لون خلفية داكن وفخم جداً */
        }

        .food-icon {
            position: absolute;
            width: 65px;
            opacity: 0.4; /* شفافية الصور حتى لا تزعج القراءة */
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        /* حركات الاصطدام يميناً ويساراً وأعلى وأسفل */
        @keyframes moveX { 0% { left: 0px; } 100% { left: calc(100vw - 65px); } }
        @keyframes moveY { 0% { top: 0px; } 100% { top: calc(100vh - 65px); } }

        /* تطبيق الحركة بسرعات مختلفة لكل عنصر لتبدو عشوائية وجميلة */
        .burger { animation: moveX 7s linear infinite alternate, moveY 9s linear infinite alternate; }
        .fries { animation: moveX 8s linear infinite alternate-reverse, moveY 6s linear infinite alternate; width: 55px; }
        .pepsi { animation: moveX 10s linear infinite alternate, moveY 7s linear infinite alternate-reverse; width: 50px; }

        /* -------------------------------------- */
        /* المحتوى الأساسي (النصوص والأزرار) */
        /* -------------------------------------- */
        .content { 
            max-width: 400px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            position: relative;
            z-index: 1; /* إبقاء المحتوى في الأمام */
        }

        /* الشعار */
        img.logo { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 15px; 
            border: 4px solid #ffb400; /* إطار أصفر فخم حول الشعار */
            box-shadow: 0 0 20px rgba(255, 180, 0, 0.5);
        }
        
        h1 { font-size: 28px; margin-bottom: 5px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        p { color: #ccc; margin-bottom: 30px; font-size: 16px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        
        /* تصميم الأزرار الاحترافي */
        a.btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-size: 18px; 
            font-weight: bold; 
            box-sizing: border-box; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        /* تأثير عند اللمس على الزر */
        a.btn:active { transform: scale(0.95); }

        /* ألوان كل زر حسب التطبيق الخاص به */
        .btn-google { background-color: #DB4437; color: white; } 
        .btn-whatsapp { background-color: #25D366; color: white; } 
        .btn-snapchat { background-color: #FFFC00; color: #000; text-shadow: none; } 
        .btn-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; } 
    </style>
</head>
<body>

    <!-- قسم الخلفية والصور المتحركة -->
    <div class="bg-animation">
        <!-- صورة البرجر -->
        <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" class="food-icon burger" alt="Burger">
        <!-- صورة البطاطا -->
        <img src="https://cdn-icons-png.flaticon.com/512/1046/1046786.png" class="food-icon fries" alt="Fries">
        <!-- صورة الكولا/بيبسي -->
        <img src="https://cdn-icons-png.flaticon.com/512/2934/2934098.png" class="food-icon pepsi" alt="Soda">
    </div>

    <!-- قسم المحتوى والأزرار -->
    <div class="content">
        <!-- الشعار -->
        <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="شعار المطعم" class="logo">
        
        <h1>🍔 برجر ستيشن</h1>
        <p>أسعدتنا زيارتك، نتشرف بتقييمك ومتابعتك!</p>

        <!-- روابطك الحقيقية تم وضعها هنا -->
        <a href="https://reviewthis.biz/1613afb2" class="btn btn-google">⭐ قيمنا على جوجل</a>
        
        <a href="https://www.instagram.com/othman_alaqqad?igsh=MXh3cHdjMzZnbWE2Nw%3D%3D&utm_source=qr" class="btn btn-instagram">📸 تابعنا على انستقرام</a>
        
        <a href="https://snapchat.com/t/cGr2yvt7" class="btn btn-snapchat">👻 تابعنا على سناب شات</a>
        
        <a href="https://wa.me/qr/O4RDOZZIGYNIE1" class="btn btn-whatsapp">💬 تواصل معنا واتساب</a>
    </div>

</body>
</html>
