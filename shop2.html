<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم برجر ستيشن</title>
    <style>
        /* كود الخلفية المتحركة */
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            text-align: center;
            /* ألوان الخلفية (يمكنك تغييرها لاحقاً) */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite; /* سرعة الحركة 10 ثواني */
            min-height: 100vh;
        }

        /* برمجة حركة الألوان */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* جعل المربع الأبيض شبه شفاف (تأثير الزجاج) */
        .container { 
            max-width: 400px; 
            margin: 20px auto; 
            background: rgba(255, 255, 255, 0.7); /* 0.7 تعني نسبة الشفافية */
            backdrop-filter: blur(10px); /* تأثير غباش للزجاج */
            padding: 30px 20px; 
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); 
        }

        img.logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid white; }
        
        h1 { font-size: 26px; color: #333; margin-bottom: 10px; font-weight: bold; }
        p { color: #555; margin-bottom: 25px; font-size: 15px; }
        
        a.btn { display: block; width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; text-decoration: none; color: white; font-size: 18px; font-weight: bold; box-sizing: border-box; transition: 0.3s; }
        
        /* تأثير عند مرور الماوس أو اللمس على الزر */
        a.btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .btn-google { background-color: #DB4437; } 
        .btn-whatsapp { background-color: #25D366; } 
        .btn-menu { background-color: #333; color: white; } 
    </style>
</head>
<body>
    <div class="container">
        <!-- الشعار -->
        <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="شعار المطعم" class="logo">
        
        <h1>🍔 مطعم برجر ستيشن</h1>
        <p>استمتع بألذ طعم.. شاركنا رأيك!</p>

        <!-- الأزرار -->
        <a href="https://google.com" class="btn btn-google">⭐ قيمنا على خرائط جوجل</a>
        <a href="https://wa.me/962790000000" class="btn btn-whatsapp">💬 للطلب عبر واتساب</a>
        <a href="#" class="btn btn-menu">🍟 تصفح المنيو الخاص بنا</a>
    </div>
</body>
</html>
