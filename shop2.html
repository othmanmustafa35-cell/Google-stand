<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم برجر ستيشن</title>
    <style>
        /* هنا قمنا بتغيير لون الخلفية ليكون مائلاً للأسود (لون المطاعم) */
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; text-align: center; padding: 20px; margin: 0; }
        
        /* هنا جعلنا خلفية المربع بيضاء وبحواف دائرية */
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        img.logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        
        /* اسم المطعم */
        h1 { font-size: 26px; color: #ff4500; margin-bottom: 20px; font-weight: bold; }
        
        a.btn { display: block; width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-decoration: none; color: white; font-size: 18px; font-weight: bold; box-sizing: border-box; }
        
        /* ألوان الأزرار */
        .btn-google { background-color: #DB4437; } /* أحمر لجوجل */
        .btn-whatsapp { background-color: #25D366; } /* أخضر للواتساب */
        .btn-menu { background-color: #ffb400; color: black; } /* أصفر لزر المنيو */
    </style>
</head>
<body>
    <div class="container">
        <!-- صورة لوجو المطعم (رابط صورة مؤقتة لبرجر) -->
        <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" alt="شعار المطعم" class="logo">
        
        <!-- اسم المطعم -->
        <h1>🍔 مطعم برجر ستيشن</h1>
        <p style="color: #666; margin-bottom: 20px;">شكراً لزيارتكم، رأيكم يهمنا!</p>

        <!-- روابط المطعم الحقيقية توضع بين علامات التنصيص بعد كلمة href -->
        <a href="https://google.com" class="btn btn-google">⭐ قيمنا على خرائط جوجل</a>
        <a href="https://wa.me/962790000000" class="btn btn-whatsapp">💬 للطلب عبر واتساب</a>
        <a href="#" class="btn btn-menu">🍟 تصفح المنيو الخاص بنا</a>
    </div>
</body>
</html>
