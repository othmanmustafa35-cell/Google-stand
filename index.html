<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم المحل</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        img.logo { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; }
        h1 { font-size: 24px; color: #333; margin-bottom: 20px; }
        a.btn { display: block; width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; text-decoration: none; color: white; font-size: 18px; font-weight: bold; box-sizing: border-box; }
        .btn-google { background-color: #DB4437; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-instagram { background-color: #E1306C; }
        .btn-facebook { background-color: #4267B2; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://via.placeholder.com/100" alt="شعار المحل" class="logo">
        <h1>اسم المحل هنا</h1>
        <a href="https://google.com" class="btn btn-google">⭐ قيمنا على جوجل</a>
        <a href="https://whatsapp.com" class="btn btn-whatsapp">💬 تواصل عبر واتساب</a>
        <a href="https://instagram.com" class="btn btn-instagram">📸 تابعنا على انستقرام</a>
        <a href="https://facebook.com" class="btn btn-facebook">👍 صفحتنا على فيسبوك</a>
    </div>
</body>
</html>
