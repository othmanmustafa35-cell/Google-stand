<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Wavy Animated Background */
    .bg-wave {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('صورة.jpg');
      background-size: cover;
      background-position: center;
      z-index: 1;
      animation: waveMotion 2s infinite ease-in-out alternate;
    }

    /* Background Animation (every 2 seconds) */
    @keyframes waveMotion {
      0% {
        transform: scale(1) translateY(0);
        filter: brightness(0.85);
      }
      50% {
        transform: scale(1.04) translateY(-8px);
        filter: brightness(1.05);
      }
      100% {
        transform: scale(1.08) translateY(6px);
        filter: brightness(0.9);
      }
    }

    /* Overlay Shadow */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      z-index: 2;
    }

    /* Card Container */
    .profile-card {
      position: relative;
      z-index: 3;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 40px 30px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 380px;
      color: #ffffff;
    }

    /* Profile Image */
    .avatar-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .profile-card p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 28px;
    }

    /* Social Buttons (Icons Only & Transparent) */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .social-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 1.4rem;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.7);
      transform: translateY(-5px) scale(1.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <!-- Animated Background Image -->
  <div class="bg-wave"></div>
  <div class="overlay"></div>

  <!-- Profile Card -->
  <div class="profile-card">
    <div class="avatar-wrapper">
      <img src="صورة.jpg" alt="Profile Picture">
    </div>

    <h1>Othman Mustafa</h1>
    <p>Welcome to my personal page</p>

    <!-- Icon Buttons (Put your link inside href) -->
    <div class="social-links">
      <!-- Phone / Call -->
      <a href="tel:+962700000000" class="social-btn" title="Phone">
        <i class="fa-solid fa-phone"></i>
      </a>

      <!-- Instagram -->
      <a href="https://instagram.com" target="_blank" class="social-btn" title="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com" target="_blank" class="social-btn" title="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/962700000000" target="_blank" class="social-btn" title="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>
    </div>
  </div>

</body>
</html>
